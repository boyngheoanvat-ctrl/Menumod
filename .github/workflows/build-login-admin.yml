name: Build Menumod ERI Login Admin IPA
on:
  push:
    branches:
      - eri-login-admin
    paths:
      - 'ios/ERILoginAdmin/**'
      - '.github/workflows/build-login-admin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned native iPhone Admin IPA
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/Payload/ERILoginAdmin.app
          cp ios/ERILoginAdmin/Info.plist build/Payload/ERILoginAdmin.app/Info.plist
          xcrun swiftc -frontend -parse ios/ERILoginAdmin/ERILoginAdminApp.swift
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios16.0 -parse-as-library -O \
            -framework SwiftUI -framework UIKit -framework Security \
            ios/ERILoginAdmin/ERILoginAdminApp.swift -o build/Payload/ERILoginAdmin.app/ERILoginAdmin
          printf 'APPL????' > build/Payload/ERILoginAdmin.app/PkgInfo
          lipo -info build/Payload/ERILoginAdmin.app/ERILoginAdmin
          cd build
          zip -q -r ERI_LOGIN_ADMIN_unsigned.ipa Payload
          unzip -tq ERI_LOGIN_ADMIN_unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Menumod-ERI-LOGIN-ADMIN-unsigned-IPA
          path: build/ERI_LOGIN_ADMIN_unsigned.ipa
          retention-days: 90
      - name: Update permanent IPA copy in Menumod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp build/ERI_LOGIN_ADMIN_unsigned.ipa releases/ERI_LOGIN_ADMIN_unsigned.ipa
          (cd releases && sha256sum ERI_LOGIN_ADMIN_unsigned.ipa > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/ERI_LOGIN_ADMIN_unsigned.ipa releases/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update ERI LOGIN ADMIN IPA with automatic one-time Admin key storage"
            git push origin HEAD:eri-login-admin
          fi
