name: Build ERI LOGIN iOS Key-Only Dylib
on:
  push:
    branches: [eri-login-admin]
    paths:
      - 'native/ios/ERILogin.m'
      - '.github/workflows/build-eri-ios-login.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-ios:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eri-login-admin
          persist-credentials: true
      - name: Compile iOS ERI native Login dylib — 1 key / 1 device
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -fobjc-arc -O2 -dynamiclib -framework UIKit -framework Foundation -framework Security -framework QuartzCore \
            -Wl,-install_name,@executable_path/Frameworks/ERILogin.dylib \
            native/ios/ERILogin.m -o native/ios/ERILogin.dylib
          lipo -info native/ios/ERILogin.dylib
          xcrun otool -D native/ios/ERILogin.dylib
          # Runtime must be key-only, never ship username/password login code.
          ! strings native/ios/ERILogin.dylib | grep -F '/api/login'
          grep -F 'MOD BY ERI' native/ios/ERILogin.m
          strings native/ios/ERILogin.dylib | grep '/api/key/activate'
      - name: Update checksums and save dylib in Menumod
        shell: bash
        run: |
          set -euo pipefail
          (cd native && sha256sum ios/ERILogin.dylib android/arm64-v8a/libERILogin.so android/armeabi-v7a/libERILogin.so > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/ios/ERILogin.dylib native/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish polished key-only ERI LOGIN iOS dylib"
            git push origin HEAD:eri-login-admin
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ERI-iOS-key-only-dylib
          path: native/ios/ERILogin.dylib
          retention-days: 90
